name: Nethunter GKI Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create 16GB Swap (To Prevent OOM Killer)
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Build Kernel (Monitor Mode & No LTO)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          
          # 1. إنشاء ملف الإعدادات الأساسي
          make LLVM=1 LLVM_IAS=1 O=out gki_defconfig
          
          # 2. الحل الجذري لقتل LTO بالقوة من داخل الملف
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/# CONFIG_LTO_CLANG_FULL is not set/' out/.config
          sed -i 's/CONFIG_LTO_CLANG_THIN=y/# CONFIG_LTO_CLANG_THIN is not set/' out/.config
          echo "CONFIG_LTO_NONE=y" >> out/.config
          
          # 3. حقن تعريفات شرائح الشبكة ووضع المراقبة (Nethunter)
          echo "CONFIG_MAC80211=y" >> out/.config
          echo "CONFIG_CFG80211=y" >> out/.config
          echo "CONFIG_CFG80211_WEXT=y" >> out/.config
          echo "CONFIG_MAC80211_MONITOR=y" >> out/.config
          echo "CONFIG_WLAN_VENDOR_REALTEK=y" >> out/.config
          echo "CONFIG_RTL8187=y" >> out/.config
          echo "CONFIG_RTL8XXXU=y" >> out/.config
          echo "CONFIG_WLAN_VENDOR_MEDIATEK=y" >> out/.config
          echo "CONFIG_MT7601U=y" >> out/.config
          echo "CONFIG_USB_NET_RNDIS_WLAN=y" >> out/.config
          
          # 4. تثبيت التعديلات الجديدة
          make LLVM=1 LLVM_IAS=1 O=out olddefconfig
          
          # 5. بدء البناء الفعلي
          make LLVM=1 LLVM_IAS=1 O=out -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Nethunter-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
