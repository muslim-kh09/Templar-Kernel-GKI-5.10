name: Simple GKI Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu

      - name: Basic Compilation Test
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          
          # تجهيز ملف الإعدادات الأساسي
          make LLVM=1 LLVM_IAS=1 O=out gki_defconfig
          
          # التعديل الجذري: إيقاف LTO تماماً لمنع استهلاك الرامات
          ./scripts/config --file out/.config -d LTO_CLANG_FULL -d LTO_CLANG_THIN -e LTO_NONE
          
          # بدء البناء الفعلي
          make LLVM=1 LLVM_IAS=1 O=out -j$(nproc)
